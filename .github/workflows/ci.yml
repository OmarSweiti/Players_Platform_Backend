name: ci

on:
  push:
    branches: [development, staging, main]
  pull_request:
    branches: [development, staging, main]

permissions:
  contents: read

# Cancel a superseded run on work branches only — never on staging or main:
# a half-cancelled promotion build tells you nothing about whether it was green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.base_ref != 'main' && github.base_ref != 'staging' &&
        github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

defaults:
  run:
    shell: bash # = bash -eo pipefail; the implicit default has no pipefail

jobs:
  # REQUIRED CHECK. The check context GitHub reports is the job's `name:` if it
  # has one, else its id — so required jobs here have no `name:`. Rename the id
  # if you like, but the ruleset context must equal it exactly, or every merge
  # waits forever for a check that never reports.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL for this job only: the migrations are proven on
    # the engine they will run on, not on a mock. Pinned by digest, like the
    # local stack (umbrella ADR-0013): Dependabot moves the digest in the
    # umbrella's infra/compose.yaml; when it does, move this one and the
    # `just migrations` recipe to the same digest in the same change.
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 # 18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # a disposable service container, not a secret
          POSTGRES_DB: ci
          # As every database is created (0.4.2, DB-51): PostgreSQL's own
          # collation, which no operating-system upgrade can reorder.
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The queue store, for the API tests, which boot the whole application.
      # The local stack's image and digest (umbrella infra/compose.yaml); move
      # them together.
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11 # 9.1.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The object store, for the storage port's tests (0.8.1): the local
      # stack's Versity gateway, its image and digest (umbrella
      # infra/compose.yaml, ADR-0020); move them together. Its test bucket is
      # made, versioned, by the tests' setup (test/harness/object-store.ts).
      objectstore:
        image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 # v1.8.0
        env:
          ROOT_ACCESS_KEY_ID: ci-objects # a disposable service container, not a secret
          ROOT_SECRET_ACCESS_KEY: ci-objects-not-a-secret
          VGW_PORT: ":7070"
          VGW_HEALTH: /health
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data/buckets
          VGW_VERSIONING_DIR: /data/versions
        volumes:
          - objectstore-buckets:/data/buckets
          - objectstore-versions:/data/versions
        ports: ["7070:7070"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7070/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # prisma.config.ts reads it: the CLI migrates as the migrator (0.4.2)
      MIGRATION_DATABASE_URL: postgresql://sadara_migrator:ci-migrator@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # the pin laptops read too — never "latest"
          cache: npm
      - name: Install exactly the reviewed lockfile
        id: install
        run: npm ci --no-audit --no-fund
      # Each wall reports its own verdict: one red step must not hide the next.
      # Keep these steps equal to `just check`, the same gate on your laptop.
      - name: The Prisma schema is valid, and the client generates from it
        id: prisma
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx --no-install prisma validate
          npx --no-install prisma generate
      - name: Build
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run build
      # The build leaves the tests out, and SWC strips their types when Vitest
      # runs them: this step is the only one that type-checks the test code.
      - name: Type-check everything, tests included
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx --no-install tsc --noEmit -p tsconfig.json
      # Independent of the linter: presentation → application → domain, adapters
      # wired only by composition roots, modules meeting through their
      # application services (.dependency-cruiser.cjs).
      - name: Module boundaries — no new violation, no stale baseline entry
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-boundaries.mjs
      - name: Unit tests
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx --no-install vitest run --project unit
      # The owner, migrator and runtime roles, from the one definition the local
      # stack and `just migrations` run too. The tests below connect as the
      # runtime role and migrate as the migrator, as every environment does.
      - name: Provision the database roles
        id: roles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i -e SADARA_MIGRATOR_PASSWORD=ci-migrator -e SADARA_APP_PASSWORD=ci-app \
            -e SADARA_REGISTRY_PASSWORD=ci-registry \
            "$POSTGRES_CONTAINER" psql -U ci -d ci -f - <scripts/database-roles.sql
      # Each run migrates a schema of its own, sadara_test_<random>, in the
      # service database, and drops it afterwards: the migration replay below
      # keeps the public schema to itself.
      - name: Integration tests on PostgreSQL 18
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' && steps.roles.outcome == 'success' }}
        env:
          DATABASE_URL_TEST: postgresql://sadara_app:ci-app@localhost:5432/ci
          MIGRATION_DATABASE_URL_TEST: postgresql://sadara_migrator:ci-migrator@localhost:5432/ci
          # The worker's tests log in as its registry role (0.7.6).
          REGISTRY_DATABASE_URL_TEST: postgresql://sadara_registry:ci-registry@localhost:5432/ci
          # The storage port's tests use the object store above (0.8.1).
          S3_ENDPOINT_TEST: http://localhost:7070
          S3_BUCKET_TEST: sadara-test
          S3_ACCESS_KEY_ID_TEST: ci-objects
          S3_SECRET_ACCESS_KEY_TEST: ci-objects-not-a-secret
        run: npx --no-install vitest run --project integration
      - name: API tests through HTTP, on PostgreSQL 18 and Valkey
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' && steps.roles.outcome == 'success' }}
        env:
          DATABASE_URL_TEST: postgresql://sadara_app:ci-app@localhost:5432/ci
          MIGRATION_DATABASE_URL_TEST: postgresql://sadara_migrator:ci-migrator@localhost:5432/ci
          # Uploads send their files to the object store above (0.8.3).
          S3_ENDPOINT_TEST: http://localhost:7070
          S3_BUCKET_TEST: sadara-test
          S3_ACCESS_KEY_ID_TEST: ci-objects
          S3_SECRET_ACCESS_KEY_TEST: ci-objects-not-a-secret
        run: npx --no-install vitest run --project e2e
      # Forward-only history is only worth something if it replays: every
      # migration applies to an empty database, and the database it produces is
      # exactly schema.prisma — a schema edit without its migration is red here.
      - name: Every migration applies to a real PostgreSQL, and the result is the schema
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' && steps.roles.outcome == 'success' }}
        run: |
          npx --no-install prisma migrate deploy
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Zero warnings. The unsafe-`any` findings in code the plan retires or
      # rebuilds (auth, medical, scouting) are recorded in
      # eslint-suppressions.json: a new one fails, and a fixed one fails too
      # until `just lint-prune` removes it, so the baseline only shrinks.
      - name: Lint — ESLint with no warnings, against the recorded baseline
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx --no-install eslint --max-warnings=0 "{src,apps,libs,test,scripts}/**/*.ts"
      - name: Format — every file is Prettier-formatted
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install prettier --check "src/**/*.ts" "test/**/*.ts" "scripts/**/*.ts"
      # The committed OpenAPI document is the API's contract (ADR-0010):
      # generated from the routes and their Zod schemas in Nest's preview
      # mode, so it needs no server and no database.
      - name: The committed API contract is what the code generates
        id: contract
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: |
          npm run openapi
          git diff --exit-code -- openapi/openapi.json
      # Against development's copy and development's reviewed exceptions, so a
      # change can never excuse itself. Work PRs only: a promotion carries
      # changes development has already accepted.
      - name: No breaking change to development's contract
        if: >-
          ${{ !cancelled() && steps.contract.outcome == 'success' &&
              github.event_name == 'pull_request' && github.base_ref == 'development' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          bash ./scripts/check-breaking-contract.sh "$BASE_SHA"

  # REQUIRED CHECK. The policy scripts and the git hooks prove they still refuse.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned, digest-verified Gitleaks release
        run: ./scripts/install-gitleaks-ci.sh
      - name: Every guard still refuses what it must
        run: bash ./scripts/test-policy.sh

  # The production image (0.2.6): it builds, carries no critical vulnerability
  # that has a fix, starts as an unprivileged user, and answers. To gate merges
  # on it, add `image` to the rulesets' required checks.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the test runner from the reviewed lockfile
        run: npm ci --no-audit --no-fund
      - name: Build the production image
        run: docker build -t sadara-backend:ci .
      # Trivy, pinned by digest, reads the image through the runner's Docker.
      # A critical vulnerability that has a fixed version fails the job; one
      # with no fix yet is reported by the scan but cannot be acted on here.
      - name: No critical vulnerability with a fix in the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress sadara-backend:ci
      - name: The image starts as an unprivileged user and answers
        run: IMAGE=sadara-backend:ci bash ./scripts/smoke-start.sh

  # REQUIRED CHECK. Secrets and attribution over what this change adds.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned, digest-verified Gitleaks release
        run: ./scripts/install-gitleaks-ci.sh
      # A PR runs the BASE branch's scanner config and checker, so a change
      # cannot relax the policy in the same diff that needs the relaxation.
      # Keep their command-line interfaces backward compatible across one
      # promotion: staging's older copy runs against every promotion PR.
      - name: Take the policy from the trusted base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/policy"
          mkdir -p "$policy"
          for file in .gitleaks.toml scripts/check-attribution.sh; do
            if [ "$EVENT_NAME" = pull_request ] && git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
              git show "$BASE_SHA:$file" >"$policy/${file##*/}"
            else
              cp "$file" "$policy/${file##*/}"
            fi
          done
      - name: No secret in the proposed commits (PR) or in the reachable history (push)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          opts=(--config "$RUNNER_TEMP/policy/.gitleaks.toml" --redact=100 --verbose
                --no-banner --log-level error --ignore-gitleaks-allow)
          if [ "$EVENT_NAME" = pull_request ]; then
            gitleaks git "${opts[@]}" --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git "${opts[@]}" .
          fi
      - name: No assistant attribution anywhere in the reachable history
        run: git rev-list HEAD | bash "$RUNNER_TEMP/policy/check-attribution.sh" --commits-stdin
      # An independent wall: it reports even when a step above went red.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc
      - name: No high or critical npm advisory in the lockfile
        if: ${{ !cancelled() }}
        run: npm audit --audit-level high

  # Runs AFTER a promotion lands (a push to staging or main) and inspects what
  # actually landed: a promotion must be a merge commit, because a squash forks
  # the branches permanently. Push-only, so it produces no check run on a pull
  # request: NEVER add it to a ruleset's required checks.
  promotion-shape:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A release branch advances only by a merge commit
        run: |
          set -euo pipefail
          if [ "$(git rev-list --no-walk --count --merges HEAD)" != 1 ]; then
            echo "::error::$GITHUB_REF_NAME advanced by a commit with fewer than two parents."
            echo "A promotion merges with a MERGE COMMIT. A squash forks the branches permanently."
            git log -1 --format='  landed: %h  %s' HEAD
            exit 1
          fi
          git log -1 --format='promotion shape OK: %h is a merge commit — %s' HEAD

  # OPTIONAL: the expensive matrix (other operating systems, packaging) runs
  # only where a break is expensive — promotion PRs and the release branches —
  # plus a weekly canary workflow for the default branch. Not a required check.
  # cross-platform:
  #   if: >-
  #     github.base_ref == 'staging' || github.base_ref == 'main' ||
  #     github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
  #   strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
  #   runs-on: ${{ matrix.os }}
