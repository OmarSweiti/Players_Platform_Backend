name: ci

on:
  push:
    branches: [development, staging, main]
  pull_request:
    branches: [development, staging, main]

permissions:
  contents: read

# Cancel a superseded run on work branches only — never on staging or main:
# a half-cancelled promotion build tells you nothing about whether it was green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.base_ref != 'main' && github.base_ref != 'staging' &&
        github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

defaults:
  run:
    shell: bash # = bash -eo pipefail; the implicit default has no pipefail

jobs:
  # REQUIRED CHECK. The check context GitHub reports is the job's `name:` if it
  # has one, else its id — so required jobs here have no `name:`. Rename the id
  # if you like, but the ruleset context must equal it exactly, or every merge
  # waits forever for a check that never reports.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL for this job only: the migrations are proven on
    # the engine they will run on, not on a mock. Pinned by digest, like the
    # local stack (umbrella ADR-0013): Dependabot moves the digest in the
    # umbrella's infra/compose.yaml; when it does, move this one and the
    # `just migrations` recipe to the same digest in the same change.
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 # 18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # a disposable service container, not a secret
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci # prisma.config.ts reads it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # the pin laptops read too — never "latest"
          cache: npm
      - name: Install exactly the reviewed lockfile
        id: install
        run: npm ci --no-audit --no-fund
      # Each wall reports its own verdict: one red step must not hide the next.
      # Keep these steps equal to `just check`, the same gate on your laptop.
      - name: The Prisma schema is valid, and the client generates from it
        id: prisma
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx --no-install prisma validate
          npx --no-install prisma generate
      - name: Build
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run build
      - name: Unit tests
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx --no-install jest --ci
      # Forward-only history is only worth something if it replays: every
      # migration applies to an empty database, and the database it produces is
      # exactly schema.prisma — a schema edit without its migration is red here.
      - name: Every migration applies to a real PostgreSQL, and the result is the schema
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: |
          npx --no-install prisma migrate deploy
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Lint is not a gate yet: at adoption (28 Sep 2026) eslint reported 748
      # problems (410 of them formatting) and prettier --check flagged 65
      # files. The changes that clear them add the steps here, so this job never
      # claims a check it does not make. Until then: `just lint`.

  # REQUIRED CHECK. The policy scripts and the git hooks prove they still refuse.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned, digest-verified Gitleaks release
        run: ./scripts/install-gitleaks-ci.sh
      - name: Every guard still refuses what it must
        run: bash ./scripts/test-policy.sh

  # REQUIRED CHECK. Secrets and attribution over what this change adds.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned, digest-verified Gitleaks release
        run: ./scripts/install-gitleaks-ci.sh
      # A PR runs the BASE branch's scanner config and checker, so a change
      # cannot relax the policy in the same diff that needs the relaxation.
      # Keep their command-line interfaces backward compatible across one
      # promotion: staging's older copy runs against every promotion PR.
      - name: Take the policy from the trusted base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/policy"
          mkdir -p "$policy"
          for file in .gitleaks.toml scripts/check-attribution.sh; do
            if [ "$EVENT_NAME" = pull_request ] && git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
              git show "$BASE_SHA:$file" >"$policy/${file##*/}"
            else
              cp "$file" "$policy/${file##*/}"
            fi
          done
      - name: No secret in the proposed commits (PR) or in the reachable history (push)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          opts=(--config "$RUNNER_TEMP/policy/.gitleaks.toml" --redact=100 --verbose
                --no-banner --log-level error --ignore-gitleaks-allow)
          if [ "$EVENT_NAME" = pull_request ]; then
            gitleaks git "${opts[@]}" --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git "${opts[@]}" .
          fi
      - name: No assistant attribution anywhere in the reachable history
        run: git rev-list HEAD | bash "$RUNNER_TEMP/policy/check-attribution.sh" --commits-stdin
      # An independent wall: it reports even when a step above went red.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc
      - name: No high or critical npm advisory in the lockfile
        if: ${{ !cancelled() }}
        run: npm audit --audit-level high

  # Runs AFTER a promotion lands (a push to staging or main) and inspects what
  # actually landed: a promotion must be a merge commit, because a squash forks
  # the branches permanently. Push-only, so it produces no check run on a pull
  # request: NEVER add it to a ruleset's required checks.
  promotion-shape:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A release branch advances only by a merge commit
        run: |
          set -euo pipefail
          if [ "$(git rev-list --no-walk --count --merges HEAD)" != 1 ]; then
            echo "::error::$GITHUB_REF_NAME advanced by a commit with fewer than two parents."
            echo "A promotion merges with a MERGE COMMIT. A squash forks the branches permanently."
            git log -1 --format='  landed: %h  %s' HEAD
            exit 1
          fi
          git log -1 --format='promotion shape OK: %h is a merge commit — %s' HEAD

  # OPTIONAL: the expensive matrix (other operating systems, packaging) runs
  # only where a break is expensive — promotion PRs and the release branches —
  # plus a weekly canary workflow for the default branch. Not a required check.
  # cross-platform:
  #   if: >-
  #     github.base_ref == 'staging' || github.base_ref == 'main' ||
  #     github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
  #   strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
  #   runs-on: ${{ matrix.os }}
